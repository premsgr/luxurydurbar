name: luxurydurbar

services:
  postgres:
    image: postgres:16-alpine
    container_name: luxurydurbar-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_PORT:-33005}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luxurydurbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxurydurbar}
      POSTGRES_DB: ${POSTGRES_DB:-luxurydurbar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: luxurydurbar-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-33016}:1025'
      - '${MAILPIT_UI_PORT:-33006}:8025'

  adminer:
    image: adminer:4
    container_name: luxurydurbar-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-33007}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
